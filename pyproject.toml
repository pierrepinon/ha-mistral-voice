[project]
name = "ha-mistral-voice"
version = "1.3.0"
description = "Intégration Home Assistant : assistant vocal 100 % cloud via l'API Mistral"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = []

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle (erreurs)
    "F",   # pyflakes
    "I",   # isort
    "ICN", # flake8-import-conventions
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # ruff spécifique
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle (avertissements)
]
ignore = [
    "PLR0911", # trop de retour de fonction
    "PLR0912", # trop de branches
    "PLR0913", # trop d'arguments
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
